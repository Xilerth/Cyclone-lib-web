<svg xmlns="http://www.w3.org/2000/svg" class="cyclo-svg" viewBox="0 0 124 160" role="img" aria-label="Cyclo, el asistente de Cyclone">
  <title>Cyclo</title>
  <style>
    svg.cyclo-svg .cyclo-float { animation: cyclo-bob 3.2s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-body { transform-origin: 60px 132px; animation: cyclo-sway 3.2s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-t { animation: cyclo-twist 2.4s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-t1 { animation-delay: -.2s; } svg.cyclo-svg .cyclo-t2 { animation-delay: -.4s; } svg.cyclo-svg .cyclo-t3 { animation-delay: -.6s; } svg.cyclo-svg .cyclo-t4 { animation-delay: -.8s; } svg.cyclo-svg .cyclo-t5 { animation-delay: -1s; }
    svg.cyclo-svg .cyclo-wind { fill: none; stroke: #fff; stroke-opacity: .45; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 14 10; animation: cyclo-spin 1.3s linear infinite; }
    svg.cyclo-svg .cyclo-w1 { animation-duration: 1.15s; } svg.cyclo-svg .cyclo-w2 { animation-duration: 1s; stroke-width: 2.3; } svg.cyclo-svg .cyclo-w3 { animation-duration: .85s; stroke-width: 2; } svg.cyclo-svg .cyclo-w4 { animation-duration: .7s; stroke-width: 1.7; } svg.cyclo-svg .cyclo-w5 { animation-duration: .55s; stroke-width: 1.4; stroke-dasharray: 8 6; }
    svg.cyclo-svg .cyclo-swirl { transform-origin: 60px 39px; animation: cyclo-swirl 2.4s linear infinite; }
    svg.cyclo-svg .cyclo-eyes { transform-origin: 61px 60px; animation: cyclo-blink 6s infinite; }
    svg.cyclo-svg .cyclo-pupils { animation: cyclo-look 9s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-gaze { transition: transform .25s ease-out; }
    svg.cyclo-svg .cyclo-arm-r { transform-origin: 99px 62px; animation: cyclo-arm-r 6s ease-in-out infinite; transition: transform .3s ease; }
    svg.cyclo-svg .cyclo-arm-l { transform-origin: 26px 76px; animation: cyclo-arm-l 3.2s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-mouth-open { opacity: 0; }
    svg.cyclo-svg .cyclo-shadow { transform-origin: 60px 150px; animation: cyclo-shadow 3.2s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-spark { transform-box: fill-box; transform-origin: center; animation: cyclo-spark 3.2s ease-in-out infinite; }

    /* Estados que activa la web con clases is-* en el svg raíz. */
    svg.cyclo-svg.is-waving .cyclo-arm-r { animation: cyclo-wave .8s ease-in-out infinite; }
    svg.cyclo-svg .cyclo-arm-point { display: none; transform-origin: 99px 62px; }
    svg.cyclo-svg.is-pointing .cyclo-arm-r, svg.cyclo-svg.is-pointing .cyclo-spark { display: none; }
    svg.cyclo-svg.is-pointing .cyclo-arm-point { display: inline; animation: cyclo-point 1.2s ease-in-out infinite; }
    svg.cyclo-svg.is-talking .cyclo-smile { animation: cyclo-talk-a .3s steps(1) infinite; }
    svg.cyclo-svg.is-talking .cyclo-mouth-open { animation: cyclo-talk-b .3s steps(1) infinite; }
    svg.cyclo-svg.is-spinning .cyclo-t { animation-duration: .4s; }
    svg.cyclo-svg.is-spinning .cyclo-swirl { animation-duration: .5s; }
    svg.cyclo-svg.is-spinning .cyclo-wind { animation-duration: .3s; }
    svg.cyclo-svg.is-spinning .cyclo-float { animation: cyclo-hop .8s ease-in-out; }
    svg.cyclo-svg.is-spinning .cyclo-arm-l, svg.cyclo-svg.is-spinning .cyclo-arm-r { animation: cyclo-flail .4s ease-in-out infinite; }

    @keyframes cyclo-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes cyclo-hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-16px); } 70% { transform: translateY(2px); } }
    @keyframes cyclo-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes cyclo-twist { 0%, 100% { transform: translateX(-2.6px); } 50% { transform: translateX(2.6px); } }
    @keyframes cyclo-spin { to { stroke-dashoffset: -24; } }
    @keyframes cyclo-swirl { from { transform: scale(1, 0.34) rotate(0deg) scale(1, 2.94); } to { transform: scale(1, 0.34) rotate(360deg) scale(1, 2.94); } }
    @keyframes cyclo-blink { 0%, 38%, 42%, 86%, 89%, 92%, 100% { transform: scaleY(1); } 40%, 87.5%, 90.5% { transform: scaleY(.1); } }
    @keyframes cyclo-look { 0%, 30%, 100% { transform: translateX(0); } 40%, 55% { transform: translateX(2px); } 65%, 80% { transform: translateX(-1.6px); } }
    @keyframes cyclo-arm-r { 0%, 4%, 34%, 100% { transform: rotate(0); } 8% { transform: rotate(-28deg); } 13% { transform: rotate(6deg); } 18% { transform: rotate(-24deg); } 23% { transform: rotate(6deg); } 28% { transform: rotate(-16deg); } 55% { transform: rotate(-6deg); } 75% { transform: rotate(4deg); } }
    @keyframes cyclo-arm-l { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
    @keyframes cyclo-point { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg) translateY(-2px); } }
    @keyframes cyclo-wave { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-30deg); } }
    @keyframes cyclo-flail { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes cyclo-talk-a { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes cyclo-talk-b { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes cyclo-shadow { 0%, 100% { transform: scaleX(1); opacity: .2; } 50% { transform: scaleX(.8); opacity: .12; } }
    @keyframes cyclo-spark { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 40%, 60% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @media (prefers-reduced-motion: reduce) { svg.cyclo-svg * { animation: none !important; transition: none !important; } }
  </style>
  <ellipse class="cyclo-shadow" cx="60" cy="150" rx="20" ry="3.6" fill="#1e1b4b"/>
  <g class="cyclo-float">
    <g class="cyclo-body">
      <g class="cyclo-t cyclo-t5">
        <ellipse cx="61" cy="118" rx="11.5" ry="3.91" fill="#8338dc"/>
        <ellipse cx="61" cy="115" rx="11.5" ry="3.91" fill="#9d55f3"/>
        <path class="cyclo-wind cyclo-w5" d="M51.57 115.5A9.43 2.42 0 0 0 70.43 115.5"/>
        <path d="M58 118 q-2 9 4 12 q5 2 6 -3" fill="none" stroke="#9d55f3" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g class="cyclo-t cyclo-t4">
        <ellipse cx="58.5" cy="106" rx="18" ry="6.12" fill="#7140dc"/>
        <ellipse cx="58.5" cy="103" rx="18" ry="6.12" fill="#8b5cf6"/>
        <path class="cyclo-wind cyclo-w4" d="M43.74 103.5A14.76 3.79 0 0 0 73.26 103.5"/>
      </g>
      <g class="cyclo-t cyclo-t3">
        <ellipse cx="62" cy="92" rx="25" ry="8.5" fill="#5d47d6"/>
        <ellipse cx="62" cy="89" rx="25" ry="8.5" fill="#7663ec"/>
        <path class="cyclo-wind cyclo-w3" d="M41.5 89.5A20.5 5.27 0 0 0 82.5 89.5"/>
      </g>
      <g class="cyclo-t cyclo-t2">
        <ellipse cx="58" cy="76" rx="32" ry="10.88" fill="#4c56d8"/>
        <ellipse cx="58" cy="73" rx="32" ry="10.88" fill="#6673ef"/>
        <path class="cyclo-wind cyclo-w2" d="M31.76 73.5A26.24 6.75 0 0 0 84.24 73.5"/>
      </g>
      <g class="cyclo-t cyclo-t1">
        <ellipse cx="63" cy="59" rx="39" ry="13.26" fill="#3f6fe0"/>
        <ellipse cx="63" cy="56" rx="39" ry="13.26" fill="#5b8ef3"/>
        <path class="cyclo-wind cyclo-w1" d="M31.02 56.5A31.98 8.22 0 0 0 94.98 56.5"/>
      </g>
      <g class="cyclo-t cyclo-t0">
        <ellipse cx="60" cy="41" rx="46" ry="15.64" fill="#2f8fdc"/>
        <ellipse cx="60" cy="38" rx="46" ry="15.64" fill="#4fb3f6"/>
        <path class="cyclo-wind cyclo-w0" d="M22.28 38.5A37.72 9.7 0 0 0 97.72 38.5"/>
        <ellipse cx="60" cy="39" rx="39" ry="13.26" fill="#3b4fd6"/>
        <clipPath id="cyclo-mouth-clip"><ellipse cx="60" cy="39" rx="39" ry="13.26"/></clipPath>
        <g clip-path="url(#cyclo-mouth-clip)"><g class="cyclo-swirl"><path d="M60 39 m-30 0 a30 10.2 0 0 1 30 -10.2 a22 7.48 0 0 1 20 3.06 M60 39 m12 1.36 a14 4.76 0 0 1 -26 0" fill="none" stroke="#bae6fd" stroke-opacity=".8" stroke-width="2.2" stroke-linecap="round"/></g></g>
      </g>
      <g class="cyclo-t cyclo-t1">
        <g class="cyclo-arm-r"><path d="M99 62 q11 -3 13 -15" fill="none" stroke="#5b8ef3" stroke-width="5" stroke-linecap="round"/><circle cx="112.5" cy="45.5" r="4.6" fill="#5b8ef3"/></g>
        <g class="cyclo-arm-point"><path d="M99 62 q9 -8 15 -26" fill="none" stroke="#5b8ef3" stroke-width="5" stroke-linecap="round"/><path d="M114.5 34 l1.5 -8" stroke="#5b8ef3" stroke-width="3.2" stroke-linecap="round"/><circle cx="114" cy="36" r="4.6" fill="#5b8ef3"/></g>
        <g class="cyclo-eyes">
          <ellipse cx="48" cy="60" rx="8.5" ry="10" fill="#fff"/><ellipse cx="74" cy="60" rx="8.5" ry="10" fill="#fff"/>
          <g class="cyclo-pupils"><g class="cyclo-gaze">
            <circle cx="49.5" cy="62" r="4.6" fill="#1e1b4b"/><circle cx="75.5" cy="62" r="4.6" fill="#1e1b4b"/>
            <circle cx="51.2" cy="59.8" r="1.6" fill="#fff"/><circle cx="77.2" cy="59.8" r="1.6" fill="#fff"/>
          </g></g>
        </g>
        <ellipse cx="38" cy="73" rx="5" ry="3" fill="#f9a8d4" opacity=".7"/><ellipse cx="84" cy="73" rx="5" ry="3" fill="#f9a8d4" opacity=".7"/>
        <path class="cyclo-smile" d="M54 74 q7 7 14 0" fill="none" stroke="#1e1b4b" stroke-width="2.6" stroke-linecap="round"/>
        <g class="cyclo-mouth-open"><ellipse cx="61" cy="76.5" rx="5" ry="4.2" fill="#1e1b4b"/><ellipse cx="61" cy="79" rx="3" ry="1.5" fill="#f472b6"/></g>
      </g>
      <g class="cyclo-t cyclo-t2">
        <g class="cyclo-arm-l"><path d="M26 76 q-10 3 -11 12" fill="none" stroke="#6673ef" stroke-width="5" stroke-linecap="round"/><circle cx="15" cy="89.5" r="4.6" fill="#6673ef"/></g>
      </g>
    </g>
  </g>
  <path class="cyclo-spark" d="M108 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fbbf24"/>
</svg>
